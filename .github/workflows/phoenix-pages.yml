name: Phoenix scan → GitHub Pages (always-on, zero cost)

# زمان‌بندی فقط روی شاخهٔ پیش‌فرض (main) اجرا می‌شود.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "تعداد ارز برتر برای اسکن"
        default: "30"
        required: false
  push:
    branches: [main, cursor/phoenix-signal-panel-69df]
    paths:
      - ".github/workflows/phoenix-pages.yml"
      - "site/**"
      - "scripts/export_static.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phoenix-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q numpy pandas requests

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Run Phoenix cycle and export static data
        env:
          PHOENIX_TOP: ${{ github.event.inputs.top || '30' }}
          PHOENIX_WORKERS: "6"
          PHOENIX_PAGES_URL: ${{ steps.pages.outputs.base_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/export_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
