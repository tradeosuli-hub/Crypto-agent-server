name: "Phoenix 1 · Scan + Organization → Pages"

# چرخهٔ اصلی (هر ۱۰ دقیقه): اسکن ارزها → ۹ دپارتمان → اجماع → A34 → تصمیم → قاضی نتیجه → حافظه → انتشار صفحه
# زمان‌بندی فقط روی شاخهٔ پیش‌فرض (main) اجرا می‌شود. تنها Workflow ای که Pages را منتشر می‌کند.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "تعداد ارز برتر برای اسکن"
        default: "30"
        required: false
      close:
        description: "ثبت دستی نتیجهٔ معامله: DECISION_ID:TP|SL:pnl_r (مثلاً D1a2b3c4d5:TP:1.8)"
        default: ""
        required: false
  push:
    branches: [main, cursor/phoenix-signal-panel-69df]
    paths:
      - ".github/workflows/phoenix-pages.yml"
      - "site/**"
      - "scripts/export_static.py"
      - "scripts/memory_sync.sh"
      - "phoenix/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phoenix-scan
  cancel-in-progress: false

env:
  MEMORY_BRANCH: phoenix-memory

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q numpy pandas requests

      - name: Restore permanent memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/memory_sync.sh restore memory

      - name: Check Pages enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages فعال نیست → Settings → Pages → Source: GitHub Actions. اسکن و حافظه همچنان انجام می‌شود."
          fi

      - name: Configure Pages
        id: pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Run scan + organization cycle
        env:
          PHOENIX_TOP: ${{ github.event.inputs.top || '30' }}
          PHOENIX_WORKERS: "6"
          PHOENIX_CLOSE: ${{ github.event.inputs.close || '' }}
          PHOENIX_MEMORY_DIR: ${{ github.workspace }}/memory
          PHOENIX_PAGES_URL: ${{ steps.pages.outputs.base_url || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/export_static.py

      - name: Persist memory (only this workflow's files)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/memory_sync.sh persist memory decisions.json accuracy.json experience.json audits.json counters.json notify_scan.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
