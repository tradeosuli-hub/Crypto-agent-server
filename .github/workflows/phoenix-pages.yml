name: "Phoenix 1 · Scan + Organization → Pages"

# چرخهٔ اصلی (هر ~۱۰ دقیقه): اسکن ارزها → ۹ دپارتمان → اجماع → A34 → تصمیم → قاضی نتیجه → حافظه → انتشار صفحه
#
# فضای جدا: هیچ‌چیز به main نمی‌رود. cron گیت‌هاب فقط روی شاخهٔ پیش‌فرض کار می‌کند، پس این Workflow
# «خودگردان» است: در پایان هر اجرا، اجرای بعدیِ خودش را روی همین شاخه dispatch می‌کند (scripts/loop.sh).
# برای شروع یا راه‌اندازی مجدد فقط یک‌بار Run workflow بزن؛ بعد از آن حلقه خودش ادامه می‌دهد
# و واچ‌داگ (Phoenix 3) اگر حلقه بمیرد زنده‌اش می‌کند. تنها Workflow ای که Pages را منتشر می‌کند.
on:
  workflow_dispatch:
    inputs:
      delay_min:
        description: "صبر قبل از اجرا (دقیقه) — حلقه خودش این را پر می‌کند؛ برای اجرای فوری ۰"
        default: "0"
        required: false
      top:
        description: "تعداد ارز برتر برای اسکن"
        default: "30"
        required: false
      close:
        description: "ثبت دستی نتیجهٔ معامله: DECISION_ID:TP|SL:pnl_r (مثلاً D1a2b3c4d5:TP:1.8)"
        default: ""
        required: false
  push:
    branches: [cursor/phoenix-signal-panel-69df]
    paths:
      - ".github/workflows/phoenix-pages.yml"
      - "site/**"
      - "scripts/export_static.py"
      - "scripts/memory_sync.sh"
      - "scripts/loop.sh"
      - "phoenix/**"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: phoenix-scan
  cancel-in-progress: false

env:
  MEMORY_BRANCH: phoenix-memory
  LOOP_DELAY_MIN: "9"   # + ~۱ دقیقه اجرا ≈ چرخهٔ ۱۰ دقیقه

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Wait for this cycle
        if: github.event.inputs.delay_min != '' && github.event.inputs.delay_min != '0'
        env:
          DELAY: ${{ github.event.inputs.delay_min }}
        run: |
          case "$DELAY" in ''|*[!0-9]*) DELAY=0 ;; esac
          echo "waiting ${DELAY} min for the next cycle"
          sleep $(( DELAY * 60 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q numpy pandas requests

      - name: Restore permanent memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/memory_sync.sh restore memory

      - name: Check Pages enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if url="$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null)"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages فعال نیست → Settings → Pages → Source: GitHub Actions. اسکن و حافظه همچنان انجام می‌شود."
          fi

      - name: Config check (visible in run summary — values are never printed)
        env:
          PAGES_ENABLED: ${{ steps.pages_check.outputs.enabled }}
          HAS_TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID != '' }}
          HAS_XAI: ${{ secrets.XAI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          ok() { [ "$1" = "true" ] && echo "✅" || echo "❌"; }
          {
            echo "## پیکربندی فضای جدا (شاخهٔ ${GITHUB_REF_NAME})"
            echo ""
            echo "| مورد | وضعیت | اگر ❌ |"
            echo "|---|---|---|"
            echo "| GitHub Pages | $(ok "$PAGES_ENABLED") | Settings → Pages → Source: **GitHub Actions** |"
            echo "| Secret TELEGRAM_BOT_TOKEN | $(ok "$HAS_TG_TOKEN") | Settings → Secrets and variables → Actions → New repository secret |"
            echo "| Secret TELEGRAM_CHAT_ID | $(ok "$HAS_TG_CHAT") | همان‌جا؛ chat_id خودت از @userinfobot |"
            echo "| Secret XAI_API_KEY (مغز Grok، اختیاری) | $(ok "$HAS_XAI") | اختیاری |"
            echo "| Secret OPENAI_API_KEY (اختیاری) | $(ok "$HAS_OPENAI") | اختیاری |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run scan + organization cycle
        env:
          PHOENIX_TOP: ${{ github.event.inputs.top || '30' }}
          PHOENIX_WORKERS: "6"
          PHOENIX_CLOSE: ${{ github.event.inputs.close || '' }}
          PHOENIX_MEMORY_DIR: ${{ github.workspace }}/memory
          PHOENIX_PAGES_URL: ${{ steps.pages_check.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/export_static.py

      - name: Persist memory (only this workflow's files)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/memory_sync.sh persist memory decisions.json accuracy.json experience.json audits.json counters.json notify_scan.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: site

      - name: Keep the loops alive (self + guard the other agents)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/loop.sh self phoenix-pages.yml "$LOOP_DELAY_MIN"
          bash scripts/loop.sh ensure phoenix-watchdog.yml || true
          bash scripts/loop.sh ensure phoenix-intel.yml || true

  # انتشار در job جدا: اگر قانون محیط github-pages این شاخه را اجازه ندهد، فقط انتشار رد می‌شود، نه اسکن و حافظه.
  deploy:
    needs: scan
    if: needs.scan.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
